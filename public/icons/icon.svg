<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC82"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B58E29"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#1B254B"/>
  <!-- Gold Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#B58E29" stroke-width="4" opacity="0.6"/>
  <!-- Summit / Crown Accent -->
  <polygon points="256,120 220,162 238,152 256,162 274,152 292,162" fill="url(#goldGrad)"/>
  <!-- Monogram -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ACWS</text>
  <!-- Subtitle -->
  <text x="256" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8">ADMIN</text>
</svg>
