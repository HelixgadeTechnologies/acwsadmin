<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ACWS Admin | Offline</title>
  <meta name="theme-color" content="#D4AF37" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #FFFFFF;
      color: #1B254B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E0E5F2;
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #FFF9E6;
      border: 2px solid #F3DC82;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      stroke: #B58E29;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #B58E29;
      background: #FFF9E6;
      border: 1px solid #F3DC82;
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #1B254B;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 13px;
      color: #A3AED0;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      background: #D4AF37;
      color: #070506;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
      background: #B58E29;
    }
    .status-pill {
      margin-top: 18px;
      font-size: 11px;
      font-weight: 600;
      color: #EF4444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <span class="badge">ACWS 2027 Curation Desk</span>
    <h1>Offline Mode</h1>
    <p>You are currently disconnected from the internet. When connection is restored, your portal will automatically reconnect to ExCeL London telemetry.</p>

    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>No Internet Connection Detected</span>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
